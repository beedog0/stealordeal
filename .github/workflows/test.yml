name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  live-catalog:
    # Builds the real price data (without publishing it) and checks title matching against it.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backfill a few days of history
        run: |
          command -v 7z || sudo apt-get install -y p7zip-full
          node scripts/backfill.mjs --days 3 --state state
      - run: node scripts/build-data.mjs --out site --prev-dir state
      - run: node scripts/smoke.mjs site/data
      - run: du -sh site/data site/data/* && ls site/data/3/h | wc -l
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site
          path: site
          retention-days: 3
